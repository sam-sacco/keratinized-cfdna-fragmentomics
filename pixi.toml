[workspace]
channels = ["conda-forge", "bioconda"]
name = "feather-cfdna-fragmentomics"
platforms = ["linux-64"]
version = "1.0.0"

[dependencies]
python = "3.12.13.*"
numpy = "2.4.6.*"
pandas = "3.0.3.*"
polars = "1.41.2.*"
scipy = "1.17.1.*"
matplotlib = "3.10.9.*"
pysam = "0.24.0.*"
pybigwig = "0.3.25.*"
gseapy = "1.3.1.*"
samtools = "*"
bedtools = "*"
r-base = "4.5.*"
"bioconductor-go.db" = "3.22.0.*"
"bioconductor-org.gg.eg.db" = "3.22.0.*"
